services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: str
      POSTGRES_PASSWORD: str
      POSTGRES_DB: str_search
    # Postgres stays on the Docker network (no host port) so `compose up`
    # does not clash with a local Postgres already on 5432.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U str -d str_search"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Runs on every `compose up`. Skips when seed rows already exist.
  seed:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: str
      POSTGRES_PASSWORD: str
      POSTGRES_DB: str_search
      DB_HOST: db
    volumes:
      - ./data/seed.sql:/seed.sql:ro
      - ./scripts/seed-if-empty.sh:/seed-if-empty.sh:ro
    entrypoint: ["/bin/sh", "/seed-if-empty.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://str:str@db:5432/str_search
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      # Browser calls host-published API; RSC/server fetch uses Docker network.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://server:8000
    depends_on:
      - server

volumes:
  pgdata:
